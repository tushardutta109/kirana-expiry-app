<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirana Expiry Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- Top Navbar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-sm">
          <i class="fa-solid fa-shop text-lg"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Kirana Expiry Tracker</h1>
          <p class="text-xs text-slate-500">Inventory Management & Expiry Alerts</p>
        </div>
      </div>
      <button onclick="document.getElementById('addItemModal').classList.remove('hidden')" 
              class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm">
        <i class="fa-solid fa-plus"></i> Add Item
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Stats Overview -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-8">
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Items</p>
          <h3 id="statTotal" class="text-2xl font-extrabold mt-1 text-slate-900">0</h3>
        </div>
        <div class="bg-indigo-50 text-indigo-600 p-3 rounded-xl"><i class="fa-solid fa-boxes-stacked text-xl"></i></div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-amber-600 uppercase tracking-wider">Expiring Soon (3 Days)</p>
          <h3 id="statExpiring" class="text-2xl font-extrabold mt-1 text-amber-600">0</h3>
        </div>
        <div class="bg-amber-50 text-amber-600 p-3 rounded-xl"><i class="fa-solid fa-clock-rotate-left text-xl"></i></div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-rose-600 uppercase tracking-wider">Expired Items</p>
          <h3 id="statExpired" class="text-2xl font-extrabold mt-1 text-rose-600">0</h3>
        </div>
        <div class="bg-rose-50 text-rose-600 p-3 rounded-xl"><i class="fa-solid fa-triangle-exclamation text-xl"></i></div>
      </div>
    </div>

    <!-- Search & Filters -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-col sm:flex-row gap-3 items-center justify-between">
      <div class="relative w-full sm:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" oninput="filterItems()" placeholder="Search item name..." 
               class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <select id="categoryFilter" onchange="filterItems()" class="border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-auto">
          <option value="">All Categories</option>
          <option value="Dairy">Dairy</option>
          <option value="Snacks">Snacks</option>
          <option value="Grains">Grains & Pulses</option>
          <option value="Beverages">Beverages</option>
          <option value="Bakery">Bakery</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>

    <!-- Inventory Table -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-500 uppercase text-xs border-b border-slate-200">
            <tr>
              <th class="px-6 py-4 font-semibold">Item Name</th>
              <th class="px-6 py-4 font-semibold">Category</th>
              <th class="px-6 py-4 font-semibold">Quantity</th>
              <th class="px-6 py-4 font-semibold">Expiry Date</th>
              <th class="px-6 py-4 font-semibold">Status</th>
              <th class="px-6 py-4 font-semibold text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="inventoryBody" class="divide-y divide-slate-100 font-medium">
            <tr>
              <td colspan="6" class="px-6 py-8 text-center text-slate-400">Loading inventory...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add Item Modal -->
  <div id="addItemModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 relative">
      <div class="flex items-center justify-between mb-4 border-b pb-3">
        <h3 class="text-lg font-bold text-slate-900">Add New Inventory Item</h3>
        <button onclick="document.getElementById('addItemModal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      
      <form id="itemForm" onsubmit="handleAddItem(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Item Name *</label>
          <input type="text" id="name" required placeholder="e.g., Amul Milk 500ml" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Category</label>
            <select id="category" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="Dairy">Dairy</option>
              <option value="Snacks">Snacks</option>
              <option value="Grains">Grains & Pulses</option>
              <option value="Beverages">Beverages</option>
              <option value="Bakery">Bakery</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Quantity *</label>
            <input type="number" id="quantity" min="1" required value="1" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Expiry Date *</label>
          <input type="date" id="expiryDate" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="document.getElementById('addItemModal').classList.add('hidden')" class="px-4 py-2 border rounded-lg text-sm text-slate-600 hover:bg-slate-50">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium shadow-sm">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allItems = [];

    async function fetchItems() {
      try {
        const res = await fetch('/api/items');
        allItems = await res.json();
        renderTable(allItems);
        updateStats(allItems);
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    function calculateStatus(expiryDate) {
      const today = new Date();
      today.setHours(0,0,0,0);
      const exp = new Date(expiryDate);
      exp.setHours(0,0,0,0);

      const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return { label: 'Expired', badgeClass: 'bg-rose-50 text-rose-700 border-rose-200' };
      } else if (diffDays <= 3) {
        return { label: `Expiring (${diffDays}d)`, badgeClass: 'bg-amber-50 text-amber-700 border-amber-200' };
      }
      return { label: 'Safe', badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
    }

    function renderTable(items) {
      const tbody = document.getElementById('inventoryBody');
      if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-slate-400">No items found.</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(item => {
        const status = calculateStatus(item.expiryDate);
        const expDate = new Date(item.expiryDate).toLocaleDateString('en-GB');

        return `
          <tr class="hover:bg-slate-50/75 transition">
            <td class="px-6 py-4 font-semibold text-slate-900">${item.name}</td>
            <td class="px-6 py-4 text-slate-600">${item.category || '-'}</td>
            <td class="px-6 py-4 text-slate-600">${item.quantity}</td>
            <td class="px-6 py-4 text-slate-600">${expDate}</td>
            <td class="px-6 py-4">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border ${status.badgeClass}">
                ${status.label}
              </span>
            </td>
            <td class="px-6 py-4 text-right">
              <button onclick="deleteItem('${item._id}')" class="text-slate-400 hover:text-rose-600 transition p-1">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function updateStats(items) {
      let expired = 0, expiring = 0;
      const today = new Date();
      today.setHours(0,0,0,0);

      items.forEach(item => {
        const exp = new Date(item.expiryDate);
        exp.setHours(0,0,0,0);
        const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
        if (diffDays < 0) expired++;
        else if (diffDays <= 3) expiring++;
      });

      document.getElementById('statTotal').innerText = items.length;
      document.getElementById('statExpiring').innerText = expiring;
      document.getElementById('statExpired').innerText = expired;
    }

    function filterItems() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;

      const filtered = allItems.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(search);
        const matchesCat = category ? item.category === category : true;
        return matchesSearch && matchesCat;
      });

      renderTable(filtered);
    }

    async function handleAddItem(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('name').value,
        category: document.getElementById('category').value,
        quantity: Number(document.getElementById('quantity').value),
        expiryDate: document.getElementById('expiryDate').value
      };

      await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      document.getElementById('addItemModal').classList.add('hidden');
      document.getElementById('itemForm').reset();
      fetchItems();
    }

    async function deleteItem(id) {
      if (!confirm('Are you sure you want to remove this item?')) return;
      await fetch(`/api/items/${id}`, { method: 'DELETE' });
      fetchItems();
    }

    fetchItems();
  </script>
</body>
</html>
