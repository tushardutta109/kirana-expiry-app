<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kirana Expiry Manager</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f1f5f9; padding: 30px; color: #1e293b; }
    .container { max-width: 1050px; margin: auto; }
    
    h1 { margin-bottom: 25px; color: #0f172a; display: flex; align-items: center; gap: 10px; font-size: 26px; }
    
    /* Stats Cards Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07); border-left: 6px solid #94a3b8; }
    .stat-card.total { border-left-color: #3b82f6; }
    .stat-card.warning { border-left-color: #f59e0b; }
    .stat-card.danger { border-left-color: #ef4444; }
    .stat-title { font-size: 13px; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; color: #0f172a; }

    /* Form Card */
    .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07); margin-bottom: 25px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #475569; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #2563eb; }
    
    .btn-submit { background-color: #2563eb; color: white; border: none; padding: 11px 22px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover { background-color: #1d4ed8; }

    /* Search & Filter Bar */
    .controls-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; align-items: center; justify-content: space-between; }
    .search-input { flex: 1; min-width: 250px; padding: 11px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: white; }
    .search-input:focus { border-color: #2563eb; }
    .filter-buttons { display: flex; gap: 8px; }
    .filter-btn { padding: 9px 15px; border: 1px solid #cbd5e1; background: white; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; color: #475569; transition: 0.2s; }
    .filter-btn.active, .filter-btn:hover { background-color: #0f172a; color: white; border-color: #0f172a; }

    /* Table Styling */
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07); }
    th, td { padding: 14px 18px; text-align: left; font-size: 14px; }
    th { background-color: #0f172a; color: white; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
    tr:nth-child(even) { background-color: #f8fafc; }
    tr:hover { background-color: #f1f5f9; }

    /* Expiry Badges */
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; text-align: center; }
    .badge-safe { background-color: #dcfce7; color: #15803d; }
    .badge-warning { background-color: #fef3c7; color: #b45309; }
    .badge-danger { background-color: #fee2e2; color: #b91c1c; }

    tr.row-danger { background-color: #fff1f2 !important; }
    tr.row-warning { background-color: #fffbeb !important; }

    /* Action Buttons */
    .btn-action { padding: 6px 12px; border: none; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: 600; margin-right: 6px; }
    .btn-edit { background-color: #e2e8f0; color: #334155; }
    .btn-delete { background-color: #fee2e2; color: #ef4444; }
    .btn-edit:hover { background-color: #cbd5e1; }
    .btn-delete:hover { background-color: #fca5a5; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🛒 Kirana Expiry & Stock Manager</h1>

    <!-- 1. Real-time Summary Cards -->
    <div class="stats-grid">
      <div class="stat-card total">
        <div class="stat-title">Total Products</div>
        <div class="stat-value" id="totalCount">0</div>
      </div>
      <div class="stat-card warning">
        <div class="stat-title">Expiring in 7 Days</div>
        <div class="stat-value" id="warningCount" style="color: #d97706;">0</div>
      </div>
      <div class="stat-card danger">
        <div class="stat-title">Expired Items</div>
        <div class="stat-value" id="dangerCount" style="color: #dc2626;">0</div>
      </div>
    </div>

    <!-- 2. Add New Item Form -->
    <div class="card">
      <h3 style="margin-bottom: 15px; color: #334155;">Naya Stock Add Karein</h3>
      <form id="itemForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Item Name</label>
            <input type="text" id="name" placeholder="e.g. Amul Butter" required />
          </div>
          <div class="form-group">
            <label>Quantity</label>
            <input type="number" id="quantity" placeholder="e.g. 15" required />
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="text" id="category" placeholder="e.g. Dairy / Bakery" required />
          </div>
          <div class="form-group">
            <label>Expiry Date</label>
            <input type="date" id="expiryDate" required />
          </div>
        </div>
        <button type="submit" class="btn-submit">+ Item Save Karein</button>
      </form>
    </div>

    <!-- 3. Search and Quick Filter Controls -->
    <div class="controls-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search item name ya category se dhoondein..." oninput="filterAndRenderItems()" />
      <div class="filter-buttons">
        <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">All</button>
        <button class="filter-btn" id="filterWarning" onclick="setFilter('warning')">Expiring Soon</button>
        <button class="filter-btn" id="filterDanger" onclick="setFilter('danger')">Expired</button>
      </div>
    </div>

    <!-- 4. Inventory Table -->
    <table>
      <thead>
        <tr>
          <th>Item Name</th>
          <th>Category</th>
          <th>Quantity</th>
          <th>Expiry Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="itemsTableBody">
        <!-- Live Filtered Data -->
      </tbody>
    </table>
  </div>

  <script>
    const API_URL = 'http://localhost:5001/api/items';
    let allItemsData = [];
    let currentFilter = 'all';

    function getExpiryStatus(expiryDateStr) {
      if (!expiryDateStr) return { label: 'No Date', badgeClass: 'badge-safe', rowClass: '', type: 'safe' };

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const expDate = new Date(expiryDateStr);
      expDate.setHours(0, 0, 0, 0);

      const diffTime = expDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return { label: 'Expired', badgeClass: 'badge-danger', rowClass: 'row-danger', type: 'danger' };
      } else if (diffDays <= 7) {
        return { label: `${diffDays} Din Bache`, badgeClass: 'badge-warning', rowClass: 'row-warning', type: 'warning' };
      } else {
        return { label: 'Safe', badgeClass: 'badge-safe', rowClass: '', type: 'safe' };
      }
    }

    async function loadItems() {
      try {
        const res = await fetch(API_URL);
        allItemsData = await res.json();
        
        let warningCount = 0;
        let dangerCount = 0;

        allItemsData.forEach(item => {
          const status = getExpiryStatus(item.expiryDate);
          if (status.type === 'danger') dangerCount++;
          if (status.type === 'warning') warningCount++;
        });

        document.getElementById('totalCount').innerText = allItemsData.length;
        document.getElementById('warningCount').innerText = warningCount;
        document.getElementById('dangerCount').innerText = dangerCount;

        filterAndRenderItems();
      } catch (err) {
        console.error('Error fetching items:', err);
      }
    }

    function setFilter(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (type === 'all') document.getElementById('filterAll').classList.add('active');
      if (type === 'warning') document.getElementById('filterWarning').classList.add('active');
      if (type === 'danger') document.getElementById('filterDanger').classList.add('active');
      filterAndRenderItems();
    }

    function filterAndRenderItems() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const tbody = document.getElementById('itemsTableBody');
      tbody.innerHTML = '';

      const filtered = allItemsData.filter(item => {
        const status = getExpiryStatus(item.expiryDate);
        const nameMatch = item.name.toLowerCase().includes(searchTerm);
        const categoryMatch = (item.category || '').toLowerCase().includes(searchTerm);
        const searchPass = nameMatch || categoryMatch;

        if (!searchPass) return false;
        if (currentFilter === 'warning') return status.type === 'warning';
        if (currentFilter === 'danger') return status.type === 'danger';
        return true;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #888; padding: 20px;">Koi matching item nahi mila!</td></tr>';
        return;
      }

      filtered.forEach(item => {
        const status = getExpiryStatus(item.expiryDate);
        const dateFormatted = item.expiryDate 
          ? new Date(item.expiryDate).toLocaleDateString('en-GB') 
          : 'N/A';

        tbody.innerHTML += `
          <tr class="${status.rowClass}">
            <td><strong>${item.name}</strong></td>
            <td>${item.category || '-'}</td>
            <td><strong>${item.quantity}</strong></td>
            <td>${dateFormatted}</td>
            <td><span class="badge ${status.badgeClass}">${status.label}</span></td>
            <td>
              <button class="btn-action btn-edit" onclick="updateQuantity('${item._id}', ${item.quantity})">Qty Update</button>
              <button class="btn-action btn-delete" onclick="deleteItem('${item._id}')">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    document.getElementById('itemForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newItem = {
        name: document.getElementById('name').value,
        quantity: Number(document.getElementById('quantity').value),
        category: document.getElementById('category').value,
        expiryDate: document.getElementById('expiryDate').value
      };

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newItem)
      });

      document.getElementById('itemForm').reset();
      loadItems();
    });

    async function updateQuantity(id, currentQty) {
      const newQty = prompt("Nayi Quantity enter karein:", currentQty);
      if (newQty !== null && newQty !== "") {
        await fetch(`${API_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quantity: Number(newQty) })
        });
        loadItems();
      }
    }

    async function deleteItem(id) {
      if (confirm("Kya aap sach me ye item delete karna chahte hain?")) {
        await fetch(`${API_URL}/${id}`, {
          method: 'DELETE'
        });
        loadItems();
      }
    }

    loadItems();
  </script>
</body>
</html>
